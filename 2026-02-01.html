                <h2>２・１ミャンマー問題研究会声明</h2>
                                    <div class="document-body">
                        <p>　2021年2月1日の軍事クーデターから今日で5年を迎えた。</p>
		                <p>　剥き出しの暴力は今やミャンマー全土を覆い、民衆は空爆・砲撃の恐怖に、飢えの苦しみの中に生きている。</p>
		                <p>　偽りの選挙は正当性を持たず、自由でも民主的でもない、恐怖による支配の継続にすぎない。</p>

		                <p>　我々はクーデター政権を必ずや打倒し、人間の尊厳を回復させ、真にボトムアップの民主主義を回復するべく、あらゆる領域において闘争を継続する。</p>
                        </div>
                        <div class="document-date">2026年2月01日</div>
                        <div class="document-sign">ミャンマー問題研究会　代表　ぱらん</div>
